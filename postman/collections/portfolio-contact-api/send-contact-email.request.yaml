$kind: http-request
name: 'Send Contact Email'
method: POST
url: '{{base_url}}/api/contact'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test User",
      "email": "test@example.com",
      "message": "Hello, I found your portfolio and would love to connect!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response confirms email sent", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("message");
        pm.expect(json.message).to.equal("Email sent successfully.");
      });

      pm.test("Response time is under 10s", function () {
        pm.expect(pm.response.responseTime).to.be.below(10000);
      });
